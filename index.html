<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docket — Texas Bar Prep Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">Docket <small>Bar Prep</small></a>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Get to test day ready.</h1>
    <p style="margin-bottom: 24px; font-size: 0.9rem;">Countdown, to-dos, subject tracking, and practice questions in one place.</p>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Log in</button>
      <button class="auth-tab" data-tab="signup">Sign up</button>
    </div>

    <div class="auth-panel active" id="login-panel">
      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Log in</button>
        <p class="msg" id="login-msg"></p>
      </form>
    </div>

    <div class="auth-panel" id="signup-panel">
      <form id="signup-form">
        <div class="field">
          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" required>
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Create account</button>
        <p class="msg" id="signup-msg"></p>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script>
  // Tab switching
  document.querySelectorAll(".auth-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".auth-tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".auth-panel").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(tab.dataset.tab + "-panel").classList.add("active");
    });
  });

  // If already logged in, skip straight to dashboard
  getSession().then(session => { if (session) window.location.href = "dashboard.html"; });

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("login-msg");
    msg.textContent = ""; msg.className = "msg";
    const email = document.getElementById("login-email").value;
    const password = document.getElementById("login-password").value;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) { msg.textContent = error.message; msg.className = "msg error"; return; }
    window.location.href = "dashboard.html";
  });

  document.getElementById("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("signup-msg");
    msg.textContent = ""; msg.className = "msg";
    const email = document.getElementById("signup-email").value;
    const password = document.getElementById("signup-password").value;
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if (error) { msg.textContent = error.message; msg.className = "msg error"; return; }
    if (data.session) {
      await ensureProfile(data.user.id);
      window.location.href = "dashboard.html";
    } else {
      msg.textContent = "Check your email to confirm your account, then log in.";
      msg.className = "msg success";
    }
  });
</script>
</body>
</html>
